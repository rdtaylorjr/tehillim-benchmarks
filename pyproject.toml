[project]
name = "tehillim-benchmarks"
version = "0.5.0"
description = "Evaluates embedding models against Psalms parallelism and genre benchmarks."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "text-fabric[github]>=13.1.0",
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "scikit-learn>=1.4",
    "numba>=0.60",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--cov=src", "--cov-report=term-missing"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 95
exclude_also = [
    "^def main\\(\\) -> None:$",
    "^if __name__ == .__main__.:$",
    "^@numba.njit",
]
